name: Deploy Fishing Brothers to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: "."
      - name: Clear stuck previous Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const stuckSha = 'a2b6c660e24d9444601d3f6b11a916b7a34acba2';
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner, repo, environment: 'github-pages', per_page: 100
            });
            const stuck = deployments.filter(d => d.sha === stuckSha);
            for (const deployment of stuck) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployment.id, per_page: 1
              });
              if (statuses[0]?.state !== 'inactive') {
                await github.rest.repos.createDeploymentStatus({
                  owner, repo, deployment_id: deployment.id, state: 'inactive',
                  description: 'Cleaning up a stale GitHub Pages deployment'
                });
              }
              await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: deployment.id });
              core.info(`Removed stale Pages deployment ${deployment.id}`);
            }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
